# Local/Codespaces test only. Never deploy this compose project on NASQO production.
name: nasqo-odoo19-development-v2
services:
  db:
    image: nasqo-postgres:16.16-alpine3.24-r1
    build:
      context: ../docker/postgres
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${NASQO_DEV_POSTGRES_PASSWORD:?missing private local Postgres password}
      NASQO_DEV_DB_PASSWORD: ${NASQO_DEV_DB_PASSWORD:?missing private local Odoo role password}
    volumes:
      - nasqo-odoo19-postgres-v2:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  odoo:
    image: odoo:19.0-20261112@sha256:49c9d2a9935f07f15e2404ce8649a84c4f0d4e70a880f7209ad27a19ab415f77
    restart: unless-stopped
    init: true
    entrypoint: ["bash", "/workspace/scripts/codespace/odoo_entrypoint.sh"]
    command: ["serve"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: nasqo_dev
      PGPASSWORD: ${NASQO_DEV_DB_PASSWORD:?missing private local Odoo role password}
      NASQO_DEV_ADMIN_PASSWORD: ${NASQO_DEV_ADMIN_PASSWORD:?missing private local Odoo admin password}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${NASQO_REPO_ROOT:?missing absolute repository root}/vendor/odoo:/workspace/vendor/odoo:ro
      - ${NASQO_REPO_ROOT:?missing absolute repository root}/addons:/workspace/addons:ro
      - ${NASQO_REPO_ROOT:?missing absolute repository root}/scripts/codespace:/workspace/scripts/codespace:ro
      - nasqo-odoo19-filestore-v2:/var/lib/odoo
    ports:
      - "127.0.0.1:8069:8069"

volumes:
  nasqo-odoo19-postgres-v2:
  nasqo-odoo19-filestore-v2:
