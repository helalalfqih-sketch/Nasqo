name: Static foundation checks
on:
  push:
    paths: ['addons/**', 'provisioning/**', 'tests/**', 'scripts/**', 'upstream.json', 'config/**', '.devcontainer/**', 'docs/CODESPACES.md', '.github/workflows/static.yml']
  pull_request:
permissions:
  contents: read
jobs:
  static:
    name: Static foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests -v
      - run: |
          for script in scripts/fetch_upstream.sh scripts/codespace/*.sh scripts/m2/*.sh .devcontainer/db-init/*.sh; do
            bash -n "$script"
          done
