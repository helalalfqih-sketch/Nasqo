name: Security and dependencies
on:
  pull_request:
permissions:
  contents: read
jobs:
  history-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan complete fetched Git history with fully redacted output
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          status=0
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --log-opts=--all . \
            > "$RUNNER_TEMP/gitleaks-redacted.log" 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "PASS: no secret findings in fetched Git history"
          else
            echo "FAIL/BLOCKED: history scanner exit $status; matched values are not printed or uploaded"
          fi
          exit "$status"
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Scan tracked source dependencies and secrets
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: security-source.json
      - name: Report findings without secret values
        if: always()
        run: python3 scripts/security_report.py security-source.json
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both new M1 and M2 runtimes use the locally built PostgreSQL image.
        image:
          - 'odoo:19.0-20261112@sha256:49c9d2a9935f07f15e2404ce8649a84c4f0d4e70a880f7209ad27a19ab415f77'
          - 'nasqo-postgres:16.16-alpine3.24-r1'
          - 'nginx:1.30.6-alpine3.24-slim@sha256:e2355aa95529a7999dad94ddcb45a8768abf6fb0b204c93b1a3ffce477d7b893'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the same PostgreSQL image used by integration tests
        if: matrix.image == 'nasqo-postgres:16.16-alpine3.24-r1'
        run: docker build --pull -t nasqo-postgres:16.16-alpine3.24-r1 docker/postgres
      - name: Scan actual runtime image dependencies
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          version: v0.69.3
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: json
          output: security-image.json
          timeout: 15m
      - name: Report vulnerability identifiers only
        if: always()
        run: python3 scripts/security_report.py security-image.json
