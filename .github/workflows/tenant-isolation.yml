name: M2 tenant isolation and restore
on:
  pull_request:
    paths:
      - 'provisioning/**'
      - 'docker/**'
      - 'scripts/m2/**'
      - 'tests/**'
      - 'addons/**'
      - 'upstream.json'
      - '.github/workflows/tenant-isolation.yml'
permissions:
  contents: read
concurrency:
  group: m2-isolation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Unit tests and shell syntax
        run: |
          python3 -B -m unittest discover -s tests -v
          for script in scripts/m2/*.sh; do bash -n "$script"; done
          shellcheck -S warning scripts/m2/*.sh
      - name: Actual tenant creation, isolation, failure recovery and encrypted restore
        run: bash scripts/m2/run.sh
      - name: Capture actual anonymous test storefronts and login
        run: python3 -B -m tests.isolation.screenshots
      - name: Publish synthetic UI screenshots only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nasqo-m2-visual-evidence
          path: |
            artifacts/visual-evidence/*.png
            artifacts/visual-evidence/provenance.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish sanitized acceptance result
        if: always()
        run: |
          if [ -f artifacts/m2-results.json ]; then
            cat artifacts/m2-results.json >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/m2-results.json
          fi
